<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Semantic Caching Proxy | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">
    <div class="max-w-4xl mx-auto w-full p-6">
        <header class="flex justify-between items-center border-b border-slate-800 pb-4 mb-6">
            <div>
                <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">LLM Semantic Caching Proxy</h1>
                <p class="text-xs text-slate-400 mt-1">Production-grade embedding similarity caching system</p>
            </div>
            <div id="stats-badge" class="bg-slate-900 border border-slate-800 px-4 py-2 rounded-lg text-sm">
                Cache Entries: <span id="cache-count" class="font-bold text-emerald-400">0</span>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Input Panel -->
            <div class="md:col-span-1 space-y-4">
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-lg">
                    <label class="block text-sm font-medium mb-2 text-slate-300">Test Query Prompt</label>
                    <textarea id="prompt-input" rows="4" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm focus:outline-none focus:border-blue-500" placeholder="e.g. Explain how Dijkstra algorithm works..."></textarea>
                    <button onclick="sendQuery()" id="submit-btn" class="w-full mt-3 bg-blue-600 hover:bg-blue-500 transition font-medium py-2 px-4 rounded-lg text-sm shadow">Send Prompt</button>
                </div>
            </div>

            <!-- Results & Telemetry Panel -->
            <div class="md:col-span-2 space-y-4">
                <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl shadow-lg">
                    <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-3">Telemetry & Response</h2>
                    <div id="result-box" class="bg-slate-950 border border-slate-800 rounded-lg p-4 min-h-[160px] font-mono text-xs text-slate-300 overflow-x-auto">
                        <span class="text-slate-600">// Send a prompt to inspect cache hit/miss latency and similarity metrics...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function updateStats() {
            try {
                const res = await fetch('/api/v1/stats');
                const data = await res.json();
                document.getElementById('cache-count').innerText = data.total_cached_queries;
            } catch (err) { console.error(err); }
        }

        async function sendQuery() {
            const prompt = document.getElementById('prompt-input').value.trim();
            if (!prompt) return;

            const btn = document.getElementById('submit-btn');
            const resultBox = document.getElementById('result-box');
            btn.disabled = true;
            btn.innerText = "Processing...";

            try {
                const res = await fetch('/api/v1/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                const data = await res.json();

                let badge = data.cache_hit 
                    ? `<span class="bg-emerald-950 text-emerald-400 px-2 py-0.5 rounded border border-emerald-800 font-bold">CACHE HIT (⚡ ${data.latency_ms}ms)</span>` 
                    : `<span class="bg-amber-950 text-amber-400 px-2 py-0.5 rounded border border-amber-800 font-bold">CACHE MISS (⏳ ${data.latency_ms}ms)</span>`;

                resultBox.innerHTML = `
                    <div class="space-y-2">
                        <div>${badge}</div>
                        <div><strong class="text-slate-400">Similarity Score:</strong> ${data.similarity_score}</div>
                        <div><strong class="text-slate-400">Response:</strong> ${data.response}</div>
                    </div>
                `;
                updateStats();
            } catch (err) {
                resultBox.innerHTML = `<span class="text-red-400">Error connecting to proxy server.</span>`;
            } finally {
                btn.disabled = false;
                btn.innerText = "Send Prompt";
            }
        }
        updateStats();
    </script>
</body>
</html>
